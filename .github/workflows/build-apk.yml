name: Build Android Native APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          mkdir -p native_project
          unzip -o *.zip -d native_project || true
          # Memindahkan file ke root jika terbungkus folder ekstra
          if [ -d native_project/app ]; then
            cp -r native_project/* .
          else
            cp -r native_project/*/* . || true
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build with Gradle
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: HDREngine-Native-APK
          path: app/build/outputs/apk/debug/*.apk
