name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Project ZIP
        run: |
          mkdir -p src_project
          unzip -o *.zip -d src_project || true

      - name: Setup Cordova and Platforms
        run: |
          npm install -g cordova
          cordova create build_folder com.hdrengine.app HDREngine
          cd build_folder
          cordova platform add android --save

      - name: Inject Web Assets
        run: |
          if [ -f src_project/index.html ]; then
            cp -r src_project/* build_folder/www/
          else
            cp -r index.html build_folder/www/ || true
            cp -r package.json build_folder/www/ || true
          fi

      - name: Build Android APK via Gradle
        uses: subosito/compile-android-apk@v1
        with:
          project-path: build_folder/platforms/android

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: HDREngine-Debug-APK
          path: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
