name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Extract Project ZIP
        run: |
          mkdir -p src_project
          unzip -o *.zip -d src_project || true
          
      - name: Setup Cordova Project
        run: |
          npm install -g cordova
          cordova create build_folder com.hdrengine.app HDREngine
          cd build_folder
          cordova platform add android
          
      - name: Inject Web Assets
        run: |
          if [ -f src_project/index.html ]; then
            cp -r src_project/* build_folder/www/
          else
            cp -r index.html build_folder/www/ || true
            cp -r package.json build_folder/www/ || true
          fi

      - name: Compile to APK
        run: |
          cd build_folder
          cordova build android --debug

      - name: Upload APK Result
        uses: actions/upload-artifact@v3
        with:
          name: HDREngine-Debug-APK
          path: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
